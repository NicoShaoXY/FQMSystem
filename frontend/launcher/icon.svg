<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 背景圆 -->
  <circle cx="256" cy="256" r="240" fill="#1a1a2e"/>
  
  <!-- 外圈装饰 -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#4a9eff" stroke-width="8"/>
  
  <!-- 电源按钮符号 -->
  <circle cx="256" cy="280" r="100" fill="none" stroke="#4a9eff" stroke-width="24" stroke-dasharray="471 157"/>
  
  <!-- 垂直线 -->
  <line x1="256" y1="120" x2="256" y2="220" stroke="#4a9eff" stroke-width="24" stroke-linecap="round"/>
  
  <!-- 内部发光效果 -->
  <circle cx="256" cy="256" r="60" fill="#4a9eff" opacity="0.3"/>
  
  <!-- 文字 -->
  <text x="256" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff">FQM</text>
</svg>